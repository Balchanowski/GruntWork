[project]
name = "gruntworkpython"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Staszek", email = "balchanowski.official@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "easyocr>=1.7.2",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
gruntworkpython = "gruntworkpython:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true